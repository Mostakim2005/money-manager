name: CI & Cloud Build Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Typecheck, Electron Compile & Verification Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Build Web Bundle
        run: npm run build

      - name: Compile Electron Main & Preload
        run: npm run electron:compile

      - name: Run Sanchaypatra, Sync, SQLite & Feature Test Suite
        run: npm test

  build-windows:
    name: Package Windows Portable Executable (.exe)
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows Portable Electron Executable (.exe)
        run: npm run electron:build

      - name: Prepare Windows Portable Artifact
        shell: bash
        run: |
          mkdir -p artifacts
          cp release/money-manager-windows-portable.exe artifacts/money-manager-windows-portable.exe

      - name: Upload Windows Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: money-manager-windows-binaries
          path: artifacts/money-manager-windows-*
          if-no-files-found: error

      - name: Attach Windows Portable .exe to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: artifacts/money-manager-windows-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
