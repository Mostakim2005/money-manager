<!DOCTYPE html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var raw = localStorage.getItem('money_manager_persisted_state_v1');
        var parsed = raw ? JSON.parse(raw) : null;
        var mode = parsed && (parsed.themeMode === 'light' || parsed.themeMode === 'dark') ? parsed.themeMode : 'dark';
        var meta = document.querySelector('meta[name="color-scheme"]');
        if (meta) meta.setAttribute('content', mode);
        document.documentElement.setAttribute('data-theme', mode);
        document.documentElement.classList.toggle('dark', mode === 'dark');
      } catch (e) {}
    </script>
    <title>Money Manager - Personal Finance & Sanchaypatra Tracker</title>
  </head>
  <body class="font-sans antialiased selection:bg-rose-500 selection:text-white">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
