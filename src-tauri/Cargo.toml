[package]
name = "money-manager"
version = "0.1.0"
description = "Cross-platform Personal Finance & Money Manager with Realbyte parity, Sanchaypatra profit tracking, and cloud sync"
authors = ["Mostakim"]
edition = "2021"

[lib]
name = "money_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "money-manager"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
